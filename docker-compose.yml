version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: adherencelens
      POSTGRES_PASSWORD: adherencelens
      POSTGRES_DB: adherencelens
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080/api"
    ports:
      - "3000:3000"

volumes:
  db-data:
